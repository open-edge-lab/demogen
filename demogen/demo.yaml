# demogen/demo.yaml — template COMMITTABILE: nessun segreto, safe da pushare.
#
# La config ufficiale e' `demogen.yaml` (gitignored, mai committata). Creala con
# `demogen init`, oppure lancia un comando qualsiasi: se manca, demogen la crea da
# questo template chiedendo la chiave OpenRouter.
#
# La chiave puo' stare direttamente in `api_key` (solo in demogen.yaml, locale)
# oppure in una variabile d'ambiente (`api_key_env`). Se `api_key` resta il
# placeholder `<...>`, viene ignorata e si usa `api_key_env`.

providers:
  openrouter:
    type: openrouter                     # base_url di default: https://openrouter.ai/api/v1
    api_key: "<INSERISCI-OPENROUTER-API-KEY>"   # ← sostituita solo in demogen.yaml (gitignored)
    api_key_env: OPENROUTER_API_KEY      # usata se api_key resta il placeholder
    headers:                             # opzionali, attribuzione app su OpenRouter
      HTTP-Referer: https://example.local/demogen
      X-Title: demogen
  local:
    type: openai_compatible
    base_url: http://localhost:8000/v1   # vLLM / llama.cpp server / LM Studio / Ollama
    api_key_env: LOCAL_API_KEY           # può essere un valore fittizio

roles:
  orchestrator:
    provider: openrouter
    model: "<id-modello>"
    temperature: 0.7
    max_tokens: 16000
    vision: auto                         # auto | true | false
    json_schema: auto                    # auto | true | false
    timeout_s: 600
    extra_body: {}                       # pass-through, es. { reasoning: { effort: medium } } per i modelli
                                         # con reasoning: il ragionamento consuma max_tokens (se la risposta
                                         # viene troncata, demogen ritenta una volta col doppio dei token)
  critic:
    provider: openrouter
    model: "<id-modello-vision>"
    temperature: 0.2
    vision: true
  math:
    provider: openrouter
    model: "<id-modello-math>"
    temperature: 0.1
  fixer:
    provider: local
    model: "<id-modello-veloce>"
    temperature: 0.0
  composer:
    inherit: orchestrator

pricing:                                 # usato se il provider non dà il costo
  "<id-modello>": { prompt_per_mtok: 0.0, completion_per_mtok: 0.0 }

budget:
  max_iterations_per_scene: 4
  max_fix_attempts: 3
  max_total_cost_usd: 5.0
  max_wall_minutes: 60
  llm_concurrency: 4

audio:
  prebuffer_s: 8.0            # prebuffer GPU renderizzato prima del play
  max_render_ms_prebuffer: 4000.0
  max_onset_err_ms: 5.0       # gate: onset vs griglia beat
