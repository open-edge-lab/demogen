name: pages
# Sito delle demo su GitHub Pages: player compilato + pagine di examples/web + galleria (scripts/build-site.mts).
# Una tantum, nelle impostazioni del repo: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: [examples/web/**, player/**, scripts/build-site.mts, package.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # >= 22.18: build-site.mts è TypeScript eseguito senza build
      - run: npm install
      - run: npm run build
      - run: npm run site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
