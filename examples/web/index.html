 diff=c-pal[i];\nfloat dd=dot(diff,diff);\nif(dd<bd){bd=dd;best=i;}\n}\nreturn pal[best];\n}\nfloat softShadow(vec3 ro,vec3 rd,float maxDist,float k){\nfloat res=1.;\nfloat t=.01;\nint n=qSteps(32);\nfor(int i=0;i<64;i++){\nif(i>=n)break;\nfloat h=map(ro+rd*t);\nif(h<.001)return 0.;\nres=min(res,k*h/t);\nt+=clamp(h,.01,.5);\nif(t>maxDist)break;\n}\nreturn clamp(res,0.,1.);\n}\nvec3 starfield(vec2 uv,float t,float speed){\nvec2 g=floor(uv*24.);\nvec2 f=fract(uv*24.);\nfloat h=hash21(g);\nvec2 star=vec2(hash21(g+1.7),hash21(g+9.2));\nstar+=.1*vec2(sin(t*(.3+h)+h*40.),cos(t*(.2+h)+h*31.));\nfloat d=length(f-star);\nfloat tw=.5+.5*sin(t*(2.+6.*h)+h*100.);\nfloat lum=smoothstep(.08,0.,d)*(.4+.6*tw)*step(.75,h);\nreturn vec3(lum);\n}\nint textChar(int i){\nif(i<0||i>=uTextLen)return 32;\nuint w=uint(uText[i>>2]);\nreturn int((w>>(8u*uint(i&3)))&0xFFu);\n}\nvec3 toSRGB(vec3 c){\nreturn mix(1.055*pow(c,vec3(1./2.4))-.055,c*12.92,step(c,vec3(.0031308)));\n}\nvec3 vignette(vec3 c,vec2 uv,float strength){\nfloat d=distance(uv,vec2(.5));\nreturn c*(1.-strength*smoothstep(.35,.85,d));\n}\nfloat vnoise(vec2 p){\nvec2 i=floor(p);\nvec2 f=fract(p);\nvec2 u=f*f*(3.-2.*f);\nfloat a=hash21(i);\nfloat b=hash21(i+vec2(1.,0.));\nfloat c=hash21(i+vec2(0.,1.));\nfloat d=hash21(i+vec2(1.,1.));\nreturn mix(mix(a,b,u.x),mix(c,d,u.x),u.y)*2.-1.;\n}\nfloat calcAO(vec3 p,vec3 n){\nfloat occ=0.;\nfloat sca=1.;\nint steps=qSteps(5);\nfor(int i=0;i<8;i++){\nif(i>=steps)break;\nfloat h=.01+.12*float(i);\nocc+=(h-map(p+n*h))*sca;\nsca*=.95;\n}\nreturn clamp(1.-3.*occ,0.,1.);\n}\nfloat drawText(vec2 fragPx,vec2 origin,float scale){\nvec2 rel=(fragPx-origin)/scale;\nif(rel.x<0.||rel.y<0.)return 0.;\nint ci=int(rel.x/8.);\nif(ci>=uTextLen||rel.y>=8.)return 0.;\nint c=textChar(ci);\nuvec2 g=fontGlyph(c);\nint col=int(rel.x)&7;\nint row=int(rel.y);\nuint bits=(row<4)?(g.x>>(8u*uint(3-row))):(g.y>>(8u*uint(7-row)));\nuint bit=(bits>>(7u-uint(col)))&1u;\nreturn float(bit);\n}\nfloat fbm(vec2 p){\nfloat amp=
