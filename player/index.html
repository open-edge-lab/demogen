<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>demogen player — play</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #hud { position: fixed; top: 8px; left: 8px; color: #0f0;
           font: 12px monospace; white-space: pre; text-shadow: 0 0 4px #000; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">loading…</div>
  <script src="dist/demogen-player.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    async function boot() {
      const canvas = document.getElementById("c");
      const hud = document.getElementById("hud");
      let payload;
      if (params.get("demo")) {
        payload = await (await fetch(params.get("demo"))).json();
      } else {
        const src = await (await fetch(params.get("shader") || "default.glsl")).text();
        const bpm = parseFloat(params.get("bpm") || "120");
        payload = {
          format: "demogen/1",
          meta: { title: "play", duration_s: 32, loop: true, bpm, beats_per_bar: 4 },
          timeline: { bpm, beats_per_bar: 4, scenes: [
            { id: "s1", start_bar: 0, bars: 16, transition_in: "cut", transition_bars: 0 },
          ] },
          common: "",
          scenes: { s1: src },
          render: { profile: params.get("profile") || "modern" },
          quality: { target_fps: 60, min_scale: 0.5 },
        };
      }
      let quality = "";
      const player = new demogenPlayer.Player(canvas, payload, {
        autoPlay: true,
        onQualityChange: (q) => { quality = "scale " + q.scale + " q " + q.uQuality + (q.bloom ? " bloom" : ""); },
      });
      await player.load();
      window.__player = player;
      // `demogen play` attende window.__demogen (stessa interfaccia info() dell'harness)
      window.__demogen = { info: () => player.info };
      const info = player.info;
      // spazio = pausa/play (la posizione resta)
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") { e.preventDefault(); player.isPlaying ? player.pause() : player.play(); }
      });
      let frames = 0, last = performance.now();
      (function hudLoop() {
        frames++;
        const now = performance.now();
        if (now - last >= 1000) {
          const q = quality;
          hud.textContent =
            "renderer: " + info.renderer + "\n" +
            "fps: " + (frames * 1000 / (now - last)).toFixed(1) + "\n" +
            "t: " + player.currentTime().toFixed(2) + "s  " + q + "\n" +
            "size: " + canvas.width + "x" + canvas.height;
          frames = 0; last = now;
        }
        requestAnimationFrame(hudLoop);
      })();
    }
    boot().catch((e) => {
      const msg = String((e && e.message) || e);
      window.__demogen_error = msg; // `demogen play` riporta l'errore invece di andare in timeout
      document.getElementById("hud").textContent = "ERROR: " + msg;
    });
  </script>
</body>
</html>
