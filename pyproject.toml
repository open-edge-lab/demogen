[project]
name = "demogen"
version = "0.1.0"
description = "Generatore offline di demo realtime stile demoscene da prompt testuale (Fase 0: motore WebGL2 dual-mode GPU/CPU)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Andrea Nucciarelli (Open Edge Consulting)" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "openai>=1.30",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pillow>=10.3",
    "playwright>=1.44",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
demogen = "demogen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live and not perf' --strict-markers"
markers = [
    "live: test con chiamate API reali (esclusi di default)",
    "perf: misure di prestazioni su GPU reale (solo locale)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # import dopo pytest.importorskip
